[server]
maxUploadSize = 600
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# One theme only: the 8x8 chess light theme. It is forced (OS dark mode is not followed) and the app's own CSS
# colours come from the same palette (app/streamlit_app.py TOKENS), so text always stays dark ink on cream.
[theme]
base = "light"
primaryColor = "#2E5E3E"
backgroundColor = "#F7F6EE"
secondaryBackgroundColor = "#ECEBDD"
textColor = "#14212A"
