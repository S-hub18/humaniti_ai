[project]
name = "cqa"
version = "0.1.0"
description = "Class Quality Assessor: grades online kids' class recordings with evidence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9,<5",
    "streamlit>=1.66.1",
    "gdown>=6.4.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
